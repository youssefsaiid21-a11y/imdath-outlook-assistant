<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Imdath Sign In</title>
  <script src="/config.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; display: flex; align-items: center;
           justify-content: center; height: 100vh; margin: 0; background: #f3f2f1; }
    .msg { text-align: center; color: #323130; }
    .spinner { width: 28px; height: 28px; border: 3px solid #e1dfdd;
               border-top-color: #0078d4; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { margin: 4px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <p>Redirecting to Microsoft sign-in...</p>
  </div>
  <script>
    async function generatePKCE() {
      const array = new Uint8Array(32);
      crypto.getRandomValues(array);
      const verifier = btoa(String.fromCharCode(...array))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      const data = new TextEncoder().encode(verifier);
      const digest = await crypto.subtle.digest('SHA-256', data);
      const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
      return { verifier, challenge };
    }

    (async function () {
      const { verifier, challenge } = await generatePKCE();
      // Embed verifier in state so auth-complete.html can retrieve it
      const state = crypto.randomUUID() + '|' + verifier;
      const scopes = loginScopes.concat(['openid', 'profile', 'offline_access']).join(' ');
      const authUrl = msalConfig.auth.authority + '/oauth2/v2.0/authorize'
        + '?client_id=' + msalConfig.auth.clientId
        + '&response_type=code'
        + '&redirect_uri=' + encodeURIComponent(window.location.origin + '/auth-complete.html')
        + '&scope=' + encodeURIComponent(scopes)
        + '&state=' + encodeURIComponent(state)
        + '&code_challenge=' + challenge
        + '&code_challenge_method=S256';
      window.location.href = authUrl;
    })();
  </script>
</body>
</html>
